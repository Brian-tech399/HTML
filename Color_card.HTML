<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Color Card</title>
    <style>
        /*Universal selector Applies to everything on page */
        * {
            font-size: 16px;
        }

        /*Element Selectors*/
        body {
            background-color:LightGray;
        }

        h1 {
            color:DarkBlue;
        }

        h2 {
            color:purple;
        }

        p {
            color:DimGray;
        }

        /*Class Selectors*/
        .my details{
            color:DarkGreen;
            font-weight:bold;
        }

        /*ID Selectors*/
        #my-card{
            background-color:Lightcyan;
        }

         </style>

</head>
<body>

    <h1>My Color Card</h1>

    <p style="color:Crimson;">Hi! This is my very own web page.</p>

    <div id="my-card">
    
        <h2>About Me</h2>
        <p class="my details">My name is Sam.</p>
        <p class="my details">My favorite color is red.</p>
        <p class="my details">my favorite subject is math.</p>
        <p class="my details">My favorite food is pasta.</p>

    </div>

    <h2>My favorite Things</h2>
    <p>My favorite animal is a cat.</p>
    <p>My favorite sport is criket.</p>
    <p>My favorite movie is Lion King.</p>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Animal Fun Facts</title>
    <style>
          /* Page background - sets the colour and font for the whole page */
    body {
        font-family: Arial; sans-serif;
    }

    /* Box Model - width sets the content area
    padding pushes the text away from the screen edge
    border draws a visible frame around the fact file
    margin pushes the fact file away from the screen edge */
    .fact-file {
        background-color: lightyellow;
        color: darklategray;
        width: 260px;
        padding: 25px;
        border: 4px solid forestgreen;
        margin: 20px;
    }

    /* Animal name - forestgreen so it standands out */
    .detail {
        color:darklategray;
    }

    /* Cool fact - orange and italic to make it feel special  */
    .cool-act {
        color: darkorange;
        font-style: italic;
    }
    </style>
  
</head>
<body>

    <div class="fact-file">
        <h2 class="animal-name ">Snow leopard</h2>
        <p class="detail">Type: Big cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer, goat, and wild sheep</p>
        <p class="cool-fact">Cool-fact: Can leap up to 15 meters in one jump !</p>
    </div>


    
</body>
</html>

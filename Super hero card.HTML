<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Super Hero Card</title>
    <style>

        /*Typography - font, size, weight, color for the whole page*/
        body {
            background-color: darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        /*Typography + Text Shadow - big bold title with  orange shadow */
        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px orange;
        }

        /*Typography + Text Transform - tagline becomes titlecase  */
        .tagline {
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        /*Text transformm + Text Decoration - section headings in caps with underline */
        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }

        /*Typography - power stands out in bold green */
        .power {
            font-weight: bold;
            color: lightgreen;
        }

        /*Typography - weakness are crossed out*/
        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        /*Transform - the badge is titled to the side */
        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(-15deg);
        }

        /*Typography - Footer text */
        .made by {
            font-style: italic;
            color: coral;
        }

    </style>

</head>
<body>

    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label"> Super Powers</h2>
    <p class="power">I can run faster than a cheetah</p>
    <p class="power">I can lift a school</p>

    <h2 class="label"> Weaknesses</h2>
    <p class="weakness">Math homework</p>
    <p class="weakness"> brocoli</p>

    <p class="badge"> TOP HERO</p>
    <p class="made by">Made by: _______________</p>

    
</body>
</html>
